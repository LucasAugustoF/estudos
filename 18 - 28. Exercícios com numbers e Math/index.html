<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>28. Exercícios com numbers e Math</title>
</head>
<body>
    <script>
        const numero = prompt('Digite um número:');
        document.body.innerHTML += '<h1>Seu número é: ' + numero + '</h1>';
        document.body.innerHTML += 'Raiz quadrada: ' + Math.sqrt(numero) + '<br />';
        document.body.innerHTML += numero + ' é inteiro? ' + Number.isInteger(Number(numero)) + '<br />';

        document.body.innerHTML += 'Arredondando para baixo: ' + Math.floor(numero) + '<br />';
        document.body.innerHTML += 'Arredondando para cima: ' + Math.ceil(numero) + '<br />';
        document.body.innerHTML += 'Com duas casas decimais: ' + Number(numero).toFixed(2) + '<br />';
    </script>
</body>
</html>
